name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.50.0

      - name: Verify bundled parinfer-rust provenance
        run: ./scripts/verify-parinfer-provenance.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          # Keep the release itself attributed to GitHub Actions. The PAT is only
          # used by GoReleaser for the cross-repository Homebrew tap publish.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}

      - name: Publish Go module compatibility tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "breyta-ci"
          git config user.email "github-actions@breyta.ai"
          module_tag="$(./scripts/release-go-module-tag.sh "${RELEASE_TAG}")"
          git push origin "${module_tag}"
