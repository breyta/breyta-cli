name: Build pinned parinfer-rust

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PARINFER_RUST_COMMIT: 7b67f166e8ad12899903a0ea451333c41ed80544
  RUST_TOOLCHAIN: 1.79.0

jobs:
  source-provenance:
    name: Verify pinned source and Cargo graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout parinfer-rust
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: eraserhd/parinfer-rust
          ref: ${{ env.PARINFER_RUST_COMMIT }}
          path: target/parinfer-rust-source
          persist-credentials: false

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify source, lock graph, licenses, and notices
        run: ./scripts/verify-parinfer-upstream.sh target/parinfer-rust-source

  linux:
    name: Linux (amd64 + arm64)
    needs: source-provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parinfer-rust
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: eraserhd/parinfer-rust
          ref: ${{ env.PARINFER_RUST_COMMIT }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-gnu

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build (amd64)
        run: cargo build --release --bin parinfer-rust

      - name: Build (arm64)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --bin parinfer-rust --target aarch64-unknown-linux-gnu

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out/linux/amd64 out/linux/arm64
          cp -v target/release/parinfer-rust out/linux/amd64/parinfer-rust
          cp -v target/aarch64-unknown-linux-gnu/release/parinfer-rust out/linux/arm64/parinfer-rust
          chmod +x out/linux/amd64/parinfer-rust out/linux/arm64/parinfer-rust

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parinfer-rust-linux-${{ env.PARINFER_RUST_COMMIT }}
          path: out

  darwin:
    name: macOS (amd64 + arm64)
    needs: source-provenance
    runs-on: macos-14
    steps:
      - name: Checkout parinfer-rust
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: eraserhd/parinfer-rust
          ref: ${{ env.PARINFER_RUST_COMMIT }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin

      - name: Build (arm64)
        run: cargo build --release --bin parinfer-rust

      - name: Build (amd64)
        run: cargo build --release --bin parinfer-rust --target x86_64-apple-darwin

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out/darwin/amd64 out/darwin/arm64
          cp -v target/x86_64-apple-darwin/release/parinfer-rust out/darwin/amd64/parinfer-rust
          cp -v target/release/parinfer-rust out/darwin/arm64/parinfer-rust
          chmod +x out/darwin/amd64/parinfer-rust out/darwin/arm64/parinfer-rust

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parinfer-rust-darwin-${{ env.PARINFER_RUST_COMMIT }}
          path: out

  windows:
    name: Windows (amd64)
    needs: source-provenance
    runs-on: windows-latest
    steps:
      - name: Checkout parinfer-rust
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: eraserhd/parinfer-rust
          ref: ${{ env.PARINFER_RUST_COMMIT }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build
        run: cargo build --release --bin parinfer-rust

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out/windows/amd64
          cp -v target/release/parinfer-rust.exe out/windows/amd64/parinfer-rust.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parinfer-rust-windows-${{ env.PARINFER_RUST_COMMIT }}
          path: out

  verify-binaries:
    name: Verify rebuilt binary hashes
    needs: [linux, darwin, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download rebuilt binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: parinfer-rust-*-${{ env.PARINFER_RUST_COMMIT }}
          path: target/rebuilt-parinfer-rust
          merge-multiple: true

      - name: Verify every rebuilt binary against SOURCE.lock
        run: ./scripts/verify-parinfer-provenance.sh target/rebuilt-parinfer-rust
