# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: breyta

before:
  hooks:
    - ./scripts/verify-parinfer-provenance.sh
    - go test ./...

builds:
  - id: breyta-unix
    main: ./cmd/breyta
    binary: breyta
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/breyta/breyta-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/breyta/breyta-cli/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/breyta/breyta-cli/internal/buildinfo.Date={{ .Date }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: breyta-windows
    main: ./cmd/breyta
    binary: breyta
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/breyta/breyta-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/breyta/breyta-cli/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/breyta/breyta-cli/internal/buildinfo.Date={{ .Date }}
    goos:
      - windows
    goarch:
      - amd64

archives:
  - id: unix
    ids:
      - breyta-unix
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: LICENSE
      - src: THIRD_PARTY_NOTICES.md
      - src: tools/parinfer-rust/LICENSE.md
        dst: licenses/parinfer-rust-ISC.md
      - src: tools/parinfer-rust/THIRD_PARTY_NOTICES.md
        dst: licenses/parinfer-rust-THIRD_PARTY_NOTICES.md
      - src: tools/parinfer-rust/SOURCE.lock
        dst: provenance/parinfer-rust-SOURCE.lock
      - src: tools/parinfer-rust/{{ .Os }}/{{ .Arch }}/parinfer-rust
        dst: parinfer-rust
  - id: windows
    ids:
      - breyta-windows
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: LICENSE
      - src: THIRD_PARTY_NOTICES.md
      - src: tools/parinfer-rust/LICENSE.md
        dst: licenses/parinfer-rust-ISC.md
      - src: tools/parinfer-rust/THIRD_PARTY_NOTICES.md
        dst: licenses/parinfer-rust-THIRD_PARTY_NOTICES.md
      - src: tools/parinfer-rust/SOURCE.lock
        dst: provenance/parinfer-rust-SOURCE.lock
      - src: tools/parinfer-rust/windows/amd64/parinfer-rust.exe
        dst: parinfer-rust.exe

checksum:
  name_template: checksums.txt

sboms:
  - id: cli-archives
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"

release:
  prerelease: auto

homebrew_casks:
  - name: breyta
    ids:
      - unix
    repository:
      owner: breyta
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/breyta/breyta-cli
    description: "Command-line interface for working with Breyta flows"
    binaries:
      - breyta
      - parinfer-rust
